<html>
  <head>
    <title>Ai proje</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix"></script>

  </head>
  
  <style>
    .arkaplan {
      background: #b4aab6;
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    .card {
      max-width: 600px;
      margin: auto;
      background: rgb(61, 57, 61);
      padding: 25px;
      border-radius: 12px;
      color: white;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .gorsel {
      margin-top: 15px;
      border-radius: 8px;
    }

    .btn {
      margin-top: 15px;
      padding: 10px;
      background: #ccc3d0;
      color: rgb(0, 0, 0);
      border: none;
      border-radius: 6px;
    }

    .btn:hover {
      background: #89739d;
    }

    #loading {
      color: #d8d8d8;
      font-size: 1em;
    }

    #result {
      font-size: 1.1em;
    }
  </style>
  
  <body class="arkaplan">
    <div class="container mt-5">
      <div class="card custom-card">
        <h3 class="text-center mb-3">TensorFlow.js ile Body Segmentation</h3>

        <input
          type="file"
          id="imageUpload"
          class="form-control mb-3"
          accept="image/*"
        />

        <img id="preview" class="img-fluid preview-img d-none" />
        
        <div id="loading" class="text-center mt-2">
        </div>

        <button id="blnkBtn" class="btn custom-btn w-100">Arka Planı Bulanıklaştır</button>
        
        <canvas id="canvas" class="w-100 mt-3 d-none"></canvas>

        <div id="result" class="text-center mt-3 fw-bold"></div>
      </div>
    </div>
  </body>

  <script>
    $("#imageUpload").on("change", function () {
      const file = this.files[0];
      if (!file) return;

      $("#preview")
        .attr("src", URL.createObjectURL(file))
        .removeClass("d-none");
    });

    var model;
    $(document).ready(async function() {
      $('#loading').text('Model yükleniyor, lütfen bekleyin...');
      model = await bodyPix.load();
      $('#loading').text('Model yüklendi. Lütfen bir görsel seçin.');
    });
    
    $("#blnkBtn").on("click", async function () {
      const input = document.getElementById("imageUpload");
      const file = input.files[0];

      if (!file) {
        alert("Lütfen önce bir görsel seçin");
        return;
      }

      if (!model) {
        alert("Model henüz yüklenmedi");
        return;
      }

      const img = document.getElementById("preview");

      if (!img.complete) {
        alert("Görsel henüz yüklenmedi");
        return;
      }

      $('#loading').text('Görsel işleniyor...');

      const segmentation = await model.segmentPerson(img);

      const canvas = document.getElementById("canvas");
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.classList.remove("d-none");

      bodyPix.drawBokehEffect(
        canvas,
        img,
        segmentation,
        6,
        6,
        false
      );

      $('#loading').text('İşlem tamamlandı! Server\'a gönderiliyor...');

      // Canvas'i base64 formatina cevir
      const canvasData = canvas.toDataURL('image/png');
      
      // Server'a gonder
      $.ajax({
        url: '/save-image',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
          imageData: canvasData,
          fileName: file.name
        }),
        success: function(response) {
          $('#loading').text('Başarılı! ' + response.message);
        },
        error: function() {
          $('#loading').text('Server\'a gönderilemedi!');
        }
      });
    });
  </script>
</html>
