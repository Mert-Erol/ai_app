<html>
   <head>
        <title>Ai proje</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"> 
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script> 
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        

        <style>
        body {
            background: #b4aab6;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        .card {
            max-width: 500px;
            margin: auto;
            background: rgb(61, 57, 61);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            color: white;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: #ccc3d0;
            color: rgb(0, 0, 0);
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #cca9ea;
        }

        #loading {
            text-align: center;
            color: #777;
            margin-top: 10px;
            font-size: 0.9em;
        }

        #result {
            margin-top: 15px;
            font-size: 1.1em;
            font-weight: bold;
            text-align: center;
        }
    </style>
    <body>
        
        <div class="card">
        <h3 style="text-align:center;">TensorFlow.js ile Metin Analizi</h3>

        <textarea id="inputText" placeholder="Analiz edilecek metni giriniz"></textarea>

        <button id="predictBtn">Analiz Et</button>

        <div id="loading">Model yükleniyor, lütfen bekleyin...</div>

        <div id="result"></div>
        
    </body>
   

</html>
