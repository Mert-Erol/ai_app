<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Süper Dedektör (Kedi & İskelet)</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

  <style>
    body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    /* Resim ve Canvas'ı üst üste bindirmek için kapsayıcı */
    .view-port {
      position: relative;
      display: inline-block;
      margin: 20px auto;
      border: 4px solid #fff;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      border-radius: 10px;
      overflow: hidden;
      background: #ddd;
      min-height: 300px;
      min-width: 300px;
    }

    /* Resim temel katman */
    #mainImage {
      display: block;
      max-width: 100%;
      height: auto;
      opacity: 0; /* Resim yüklenene kadar gizli */
      transition: opacity 0.3s;
    }

    /* Canvas (Çizim Alanı) resmin tam üstünde duracak */
    #skeletonCanvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none; /* Tıklamalar resme geçsin */
    }

    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
  </style>
</head>
<body>

<div class="container py-5 text-center">
  <h1 class="mb-3">🕵️ Süper Dedektör</h1>
  <p class="text-muted">Bu yapay zeka hem <strong>Kedileri</strong> tanır hem de <strong>İnsan İskeletini</strong> çizer.</p>

  <div class="card p-4 mb-4 shadow-sm mx-auto" style="max-width: 600px;">
    <div id="modelStatus" class="alert alert-warning">
      <span class="spinner-border spinner-border-sm"></span> Modeller yükleniyor (Biraz sürebilir)...
    </div>

    <input type="file" id="fileInput" class="form-control mb-3" accept="image/*" disabled>
    <button id="analyzeBtn" class="btn btn-primary w-100" disabled>Analiz Et</button>
  </div>

  <div id="resultsArea" class="mb-3"></div>

  <div class="view-port">
    <div id="loadingOverlay" class="loading-overlay" style="display:none;">
      <div class="spinner-border text-primary"></div>
    </div>
    <img id="mainImage" src="" alt="Yüklenen Resim">
    <canvas id="skeletonCanvas"></canvas>
    <div id="placeholderText" class="position-absolute top-50 start-50 translate-middle text-muted">
      Resim bekleniyor...
    </div>
  </div>

</div>

<script>
  // --- Değişkenler ---
  let catClassifier; // Kedi bulan (ml5)
  let poseDetector;  // İskelet bulan (TFjs)
  
  const statusEl = document.getElementById('modelStatus');
  const fileInput = document.getElementById('fileInput');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const imgEl = document.getElementById('mainImage');
  const canvas = document.getElementById('skeletonCanvas');
  const ctx = canvas.getContext('2d');
  const resultsArea = document.getElementById('resultsArea');
  const loader = document.getElementById('loadingOverlay');
  const placeholder = document.getElementById('placeholderText');

  // --- 1. Modelleri Başlat ---
  async function initModels() {
    try {
      // A) Kedi Modeli (MobileNet)
      catClassifier = await ml5.imageClassifier('MobileNet');
      
      // B) İskelet Modeli (MoveNet)
      const detectorConfig = { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING };
      poseDetector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, detectorConfig);

      // Hazır
      statusEl.className = 'alert alert-success';
      statusEl.textContent = '✅ Tüm Yapay Zeka Modelleri Hazır!';
      fileInput.disabled = false;
    } catch (err) {
      statusEl.className = 'alert alert-danger';
      statusEl.textContent = 'Hata: Modeller yüklenemedi. Konsola bakınız.';
      console.error(err);
    }
  }
  
  initModels(); // Başlat

  // --- 2. Resim Yükleme ve Ayarlama ---
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const url = URL.createObjectURL(file);
    imgEl.src = url;
    
    imgEl.onload = () => {
      // Resmi göster, placeholder'ı gizle
      imgEl.style.opacity = 1;
      placeholder.style.display = 'none';
      
      // Canvas boyutunu resimle birebir eşitle (Çok Önemli!)
      canvas.width = imgEl.width;
      canvas.height = imgEl.height;
      
      // Eski çizimi temizle
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      resultsArea.innerHTML = '';
      analyzeBtn.disabled = false;
    };
  });

  // --- 3. Analiz İşlemi ---
  analyzeBtn.addEventListener('click', async () => {
    analyzeBtn.disabled = true;
    loader.style.display = 'flex'; // Yükleniyor dönen daire
    resultsArea.innerHTML = '';

    // --- A. Kedi/Nesne Analizi ---
    let catMessage = '';
    let isCat = false;
    
    // ml5 sınıflandırma
    const classification = await catClassifier.classify(imgEl);
    const topResult = classification[0];
    const label = topResult.label.toLowerCase();
    const conf = (topResult.confidence * 100).toFixed(1);

    // Kedi kontrolü
    if (label.includes('cat') || label.includes('kitten') || label.includes('tabby')) {
      isCat = true;
      catMessage = `<div class="alert alert-success fw-bold">😺 KEDİ TESPİT EDİLDİ! (%${conf} - ${topResult.label})</div>`;
    } else {
      catMessage = `<div class="alert alert-secondary">🔍 Nesne: <strong>${topResult.label}</strong> (%${conf})</div>`;
    }

    // --- B. İskelet Analizi ---
    let poseMessage = '';
    let poses = [];
    try {
      poses = await poseDetector.estimatePoses(imgEl);
    } catch(e) { console.error(e); }

    // Eğer insan bulunduysa çizim yap
    if (poses.length > 0 && poses[0].score > 0.25) { // Güven skoru 0.25 üstü ise
      drawSkeleton(poses[0].keypoints);
      poseMessage = `<div class="alert alert-info fw-bold">🦴 İNSAN İSKELETİ ÇİZİLDİ!</div>`;
    } else {
      // İnsan bulunamadıysa
      poseMessage = `<div class="alert alert-light border">❌ İnsan iskeleti bulunamadı.</div>`;
    }

    // Sonuçları Yazdır
    resultsArea.innerHTML = catMessage + poseMessage;
    
    loader.style.display = 'none';
    analyzeBtn.disabled = false;
  });

  // --- 4. İskelet Çizim Fonksiyonu ---
  function drawSkeleton(keypoints) {
    // Çizgi stilleri
    ctx.fillStyle = '#00FF00'; // Nokta rengi (Yeşil)
    ctx.strokeStyle = '#FF0055'; // Çizgi rengi (Pembe)
    ctx.lineWidth = 4;

    // Noktaları Çiz
    keypoints.forEach(p => {
      if (p.score > 0.3) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6, 0, 2 * Math.PI);
        ctx.fill();
      }
    });

    // Bağlantıları Çiz (Basit bir iskelet haritası)
    // MoveNet noktaları: 0:Burun, 5:Sol Omuz, 6:Sağ Omuz, ...
    const adjacents = [
      [5, 6], [5, 7], [7, 9], // Kollar (Üst)
      [6, 8], [8, 10],        // Kollar (Alt)
      [5, 11], [6, 12],       // Gövde
      [11, 12],               // Kalça
      [11, 13], [13, 15],     // Sol Bacak
      [12, 14], [14, 16]      // Sağ Bacak
    ];

    adjacents.forEach(([i, j]) => {
      const p1 = keypoints[i];
      const p2 = keypoints[j];
      if (p1.score > 0.3 && p2.score > 0.3) {
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
    });
  }

</script>

</body>
</html>
