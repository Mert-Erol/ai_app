<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Dil Algılama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background-image: url(background.jpg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            border-radius: 8px;
            border: none;
        }
        .card:hover {
            border-radius: 18px;
            transform: translateY(-1px);
            box-shadow: 0 50px 50px rgba(15, 216, 163, 0.15);
            transition: 0.5s;
        }

        .card-title {
            font-weight: 600;
        }
        textarea {
            resize: none;
        }

        .btn-detect {
            background: linear-gradient(135deg, #4682A9, #749BC2);
            border: none;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .btn-detect:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(0,0,0,.15);
        }

        .result-box {
            border-radius: 12px;
            background: #f8f9fa;
            animation: fadeIn .4s ease-in-out;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow-lg">
                <div class="card-body p-4">

                    <h4 class="card-title text-center mb-1">
                        🌍 Dil Algılama
                    </h4>
                    <p class="text-muted text-center mb-4">
                        Metni gir, dilini saniyeler içinde öğren
                    </p>

                    <!-- Textarea -->
                    <div class="mb-3">
                        <textarea id="textInput" class="form-control form-control-lg"
                                  rows="4" placeholder="Örnek: Hello, how are you?"></textarea>
                    </div>

                    <!-- Button -->
                    <button id="detectBtn" class="btn btn-detect text-white w-100 py-2"
                            onclick="detectLanguage()">
                        Algıla
                        <span id="loadingSpinner" class="d-none">
                            <div class="spinner-border spinner-border-sm ms-2" role="status"></div>
                        </span>
                    </button>

                    <!-- Result -->
                    <div id="result" class="result-box text-center mt-4 p-3 d-none">
                        <i class="bi bi-translate fs-3 text-primary"></i>
                        <p class="mt-2 mb-0">
                            Algılanan Dil:
                            <strong id="languageResult">Türkçe</strong>
                        </p>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
