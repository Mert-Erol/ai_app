<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OCR Analiz Paneli</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .preview-box {
        min-height: 200px;
        border: 2px dashed #dee2e6;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
      }
      .result-section {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 15px;
        margin-top: 15px;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row g-4">
        <div class="col-md-4">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-body mt-5">
              <h3 class="card-title mb-4 mt-5 text-center">Görsel Yükle</h5>
              <div class="mb-3 mt-5">
                <label for="imageInput" class="form-label text-muted small"
                  >Bir resim dosyası seçin</label
                >
                <input type="file" class="form-control" id="imageInput" />
              </div>
              <button class="btn btn-primary w-100 mt-2 py-2">
                Analizi Başlat
              </button>
            </div>
          </div>
        </div>

        <div class="col-md-8">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <h6 class="text-uppercase text-muted small fw-bold mb-3 text-center">
                Görsel Ön İzleme
              </h6>
              <div class="preview-box mb-4">
                <img src="" alt="">
              </div>

              <hr />

              <div class="result-section ">
                <h6 class="fw-bold text-primary">
                  <i class="bi bi-text-paragraph"></i> OCR Sonucu (Okunan Metin)
                </h6>
                <p class="mb-0 text-dark">
                  <p id="resultText">metin</p>
                </p>
              </div>

              <div class="result-section border-start border-4 border-success ">
                <h6 class="fw-bold text-success  ">Duygu Analizi Sonucu</h6>
                <div class="d-flex align-items-center mt-2">
                  <span class="display-6 me-3"></span>
                  <div>
                    <div class="fw-bold"></div>
                    <small class="text-muted"></small>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  
</html>
