<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duygu Analizi (jQuery ekledim.)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .hero-section { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 60px 0; border-radius: 0 0 50px 50px; }
        .card { border-radius: 20px; border: none; transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .sentiment-badge { font-size: 1.2rem; padding: 10px 20px; border-radius: 50px; background-color: #e9ecef; }
    </style>
</head>
<body>

    <div class="hero-section text-center shadow-lg">
        <div class="container">
            <h1 class="display-4 fw-bold">Duygu Analizi</h1>
            <p class="lead">Yapay zeka duyguyu TensorFlow & jQuery ile analiz ediyor.</p>
        </div>
    </div>

    <div class="container" style="margin-top: -50px;">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg p-4">
                    <form id="sentimentForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">Analiz Edilecek Metin...</label>
                            <textarea id="userInput" class="form-control form-control-lg" rows="4" placeholder="Merhaba Hocam nasıl hissediyorsunuz?" required></textarea>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg shadow">
                                <i class="bi bi-search-heart me-2"></i>Duyguyu Analiz Et
                            </button>
                        </div>
                    </form>

                    <div id="analysisResult" class="mt-5 d-none text-center">
                        <hr>
                        <h4 class="mb-3 text-secondary">Analiz Sonucu</h4>
                        <div id="sentimentText" class="sentiment-badge d-inline-block mb-3"></div>
                        <div class="progress mt-3" style="height: 15px; border-radius: 10px;">
                            <div id="sentimentScore" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"></div>
                        </div>
                        <p id="scoreLabel" class="mt-2 text-muted small"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>

    <script>
        $(document).ready(function() {
            const POSITIVE_WORDS = ['harika', 'iyi', 'muhteşem', 'güzel', 'mutlu', 'başarılı', 'seviyorum', 'mükemmel', 'yolunda', 'harikaa'];
            const NEGATIVE_WORDS = ['kötü', 'üzgün', 'berbat', 'nefret', 'başarısız', 'hayır', 'sorun', 'çirkin', 'korkunç'];

            $('#sentimentForm').on('submit', async function(e) {
                e.preventDefault();
                
                const text = $('#userInput').val().toLowerCase();
                const words = text.split(/\s+/);
                
                // Basit Puanlama
                let score = 0;
                words.forEach(word => {
                    if (POSITIVE_WORDS.includes(word)) score += 1;
                    if (NEGATIVE_WORDS.includes(word)) score -= 1;
                });

                // TensorFlow Sigmoid İşlemi
                const inputTensor = tf.scalar(score);
                const sentimentTensor = tf.sigmoid(inputTensor);
                const finalScore = (await sentimentTensor.data())[0];

                // Sonuçları Göster
                updateUI(finalScore);
            });

            function updateUI(score) {
                let durum = "NÖTR... KARARSIZIM";
                let renk = "bg-secondary";

                if (score > 0.6) {
                    durum = "POZİTİF GÖRÜNÜYOR :) HARİKAA OLEY!";
                    renk = "bg-success";
                } else if (score < 0.4) {
                    durum = "NEGATİF GÖRÜNÜYOR :/ ÜZGÜNÜMMM";
                    renk = "bg-danger";
                }

                $('#analysisResult').removeClass('d-none');
                $('#sentimentText').text(durum);
                $('#sentimentScore').css('width', (score * 100) + '%').removeClass('bg-success bg-danger bg-secondary').addClass(renk);
                $('#scoreLabel').text("Analiz Doğruluk Yüzdesi: %" + (score * 100).toFixed(0));
            }
        });
    </script>
</body>
</html>
