<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Duygu Analizi Uygulaması</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }
        textarea {
            resize: none;
        }
        #result {
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body text-center">
            <h3 class="mb-3">🧠 Duygu Analizi</h3>

            <textarea id="text" class="form-control mb-3" rows="4"
                placeholder="Bir cümle yazınız..."></textarea>

            <button id="analyzeBtn" class="btn btn-primary w-100">
                Analiz Et
            </button>

            <div id="result" class="mt-3"></div>
        </div>
    </div>
</div>

<script>
    const positiveWords = [
        "iyi", "güzel", "harika", "mükemmel", "mutlu", "seviyorum", "süper"
    ];

    const negativeWords = [
        "kötü", "berbat", "nefret", "üzgün", "sinirli", "rezalet"
    ];

    $("#analyzeBtn").click(function () {
        const text = $("#text").val().toLowerCase();
        const words = text.split(" ");

        let score = 0;

        words.forEach(word => {
            if (positiveWords.includes(word)) score++;
            if (negativeWords.includes(word)) score--;
        });

        let resultText = "Nötr 😐";
        let resultClass = "text-secondary";

        if (score > 0) {
            resultText = "Pozitif 😀";
            resultClass = "text-success";
        } else if (score < 0) {
            resultText = "Negatif 😡";
            resultClass = "text-danger";
        }

        $("#result")
            .removeClass()
            .addClass(resultClass)
            .text("Sonuç: " + resultText);
    });
</script>

</body>
</html>
