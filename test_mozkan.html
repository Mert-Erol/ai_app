<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TensorFlow Görüntü Sınıflandırma</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f0f2f5;
      }
      .container-fluid {
        max-width: 1400px;
        padding: 20px;
      }
      .display-box {
        min-height: 500px;
        position: relative;
        background-color: #ffffff;
        border: 2px dashed #dee2e6;
        border-radius: 12px;
        overflow: hidden;
      }
      .log-container {
        height: 300px;
        overflow-y: auto;
        background: #212529;
        color: #00ff00;
        font-family: "Courier New", Courier, monospace;
        font-size: 0.85rem;
        padding: 10px;
        border-radius: 8px;
      }
      .card {
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row g-3">
        <div class="col-md-3">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-body">
              <h5 class="card-title mb-3 text-center">LOG SYSTEM</h5>
              <div id="logConsole" class="log-container mb-3">
                > Sistem hazır...
              </div>
              <div class="d-grid shadow-sm">
                <button class="btn btn-dark btn-sm" id="fetchLogs">
                  Eski Logları Getir (LocalStorage)
                </button>
                <button class="btn btn-dark btn-sm mt-2" id="clearLogs">
                  Logları Temizle
                </button>
                <button class="btn btn-dark btn-sm mt-2" id="saveLogs">
                  Logları Kaydet
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-body mt-5">
              <h5 class="card-title mb-4 mt-5 text-center">Görsel Yükle</h5>
              <div class="mb-3 mt-5">
                <input
                  class="form-control"
                  type="file"
                  id="imageUpload"
                  accept="image/*"
                />
              </div>

              <div class="d-grid gap-2 mt-4">
                <button
                  class="btn btn-primary fw-bold"
                  id="predictBtn"
                  disabled
                >
                  Analiz Et
                </button>
                <button class="btn btn-light btn-sm text-muted" id="clearBtn">
                  Temizle
                </button>
              </div>

              <div id="resultArea" class="mt-4 d-none">
                <h6 class="border-bottom pb-2">Sonuçlar:</h6>
                <ul
                  class="list-group list-group-flush"
                  id="predictionList"
                ></ul>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div
            class="display-box shadow-sm d-flex align-items-center justify-content-center"
          >
            <div id="placeholderText" class="text-center text-muted">
              <p class="mb-0">Resim Bekleniyor...</p>
            </div>

            <img
              id="previewImage"
              src="#"
              alt="Önizleme"
              class="img-fluid d-none"
              style="max-height: 550px; z-index: 1"
            />

            <canvas
              id="outputCanvas"
              style="
                position: absolute;
                top: 0;
                left: 0;
                z-index: 2;
                pointer-events: none;
              "
            ></canvas>
          </div>
        </div>
      </div>
    </div>

    <script>
      $(document).ready(function () {
        $("#imageUpload").on("change", function () {
          const file = this.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
              $("#previewImage")
                .attr("src", e.target.result)
                .removeClass("d-none");
              $("#placeholderText").addClass("d-none");
              $("#predictBtn").prop("disabled", false);
              $("#logConsole").append("<br> > Görsel yüklendi: " + file.name);
              $("#logConsole").append("<br> > Analiz için hazır...");
            };
            reader.readAsDataURL(file);
          }
        });
      });
    </script>
  </body>
</html>
