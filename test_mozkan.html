<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TensorFlow Görüntü Sınıflandırma</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f8f9fa;
      }
      .container {
        max-width: 1100px;
      }
      .display-box {
        min-height: 450px;
        position: relative;
        background-color: #ffffff;
        border: 2px dashed #dee2e6;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row g-4">
        <div class="col-md-4">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-body p-4">
              <h5 class="card-title mb-4 mt-5">Görsel Yükle</h5>
              <p class="text-muted small mt-5">Lütfen bir görsel seçiniz.</p>

              <div class="mb-3">
                <input
                  class="form-control"
                  type="file"
                  id="imageUpload"
                  accept="image/*"
                />
              </div>

              <div class="d-grid gap-2 mt-4">
                <button class="btn btn-primary" id="predictBtn" disabled>
                  Analiz Et
                </button>
                <button class="btn btn-outline-secondary btn-sm" id="clearBtn">
                  Temizle
                </button>
              </div>

              <div id="resultArea" class="mt-4 d-none">
                <h6>Sonuçlar:</h6>
                <ul
                  class="list-group list-group-flush"
                  id="predictionList"
                ></ul>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-8">
          <div
            class="display-box shadow-sm d-flex align-items-center justify-content-center"
          >
            <div id="placeholderText" class="text-center text-muted">
              <p class="mb-0">Henüz bir resim seçilmedi</p>
            </div>

            <img
              id="previewImage"
              src="#"
              alt="Önizleme"
              class="img-fluid rounded d-none"
              style="max-height: 500px; z-index: 1"
            />

            <canvas
              id="outputCanvas"
              style="position: absolute; top: 0; left: 0; z-index: 2"
            ></canvas>
          </div>
        </div>
      </div>
    </div>
    <script></script>
  </body>
</html>
