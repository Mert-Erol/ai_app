<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TensorFlow Duygu Analizi</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/universal-sentence-encoder@latest"></script>

    <style>
      body {
        background-color: #f0f2f5;
        height: 100vh;
        display: flex;
        align-items: center;
      }
      .card {
        border: none;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      }
      .btn-primary {
        background-color: #4f46e5;
        border: none;
        padding: 12px;
        border-radius: 10px;
        font-weight: 600;
      }
      .btn-primary:hover {
        background-color: #4338ca;
      }
      textarea {
        border: 2px solid #e5e7eb !important;
        border-radius: 10px !important;
        resize: none;
      }
      textarea:focus {
        box-shadow: none !important;
        border-color: #4f46e5 !important;
      }
      #result {
        border-radius: 10px;
        transition: all 0.3s ease;
      }
      .res-box {
        padding: 15px;
        border-radius: 10px;
        font-weight: bold;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card p-4">
            <h3 class="text-center mb-4 fw-bold">Duygu Analizi</h3>

            <div class="mb-3">
              <label class="form-label text-secondary small fw-bold"
                >CÜMLE GİRİN</label
              >
              <textarea
                class="form-control"
                id="inputText"
                rows="4"
                placeholder="Bir cümle yazın..."
              ></textarea>
            </div>

            <div class="d-grid">
              <button id="predictBtn" class="btn btn-primary" disabled>
                <span id="btnText">Model Yükleniyor...</span>
              </button>
            </div>

            <div id="result" class="mt-4"></div>
          </div>
        </div>
      </div>
    </div>

    <script></script>
  </body>
</html>
