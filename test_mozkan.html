<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TensorFlow Analiz</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/universal-sentence-encoder@latest"></script>
  </head>
  <body>
    <div class="container">
      <h2>TensorFlow ile Duygu Analizi</h2>
      <div class="form-group">
        <label for="inputText">Cümle Girin:</label>
        <textarea
          class="form-control"
          id="inputText"
          rows="3"
          placeholder="Örnek: Bu harika bir gün!"
        ></textarea>
      </div>
      <button id="predictBtn" class="btn btn-primary" disabled>
        Model Yükleniyor...
      </button>
      <div id="result" style="margin-top: 20px"></div>
    </div>

    <script>
      let encoder;
      const btn = document.getElementById("predictBtn");
      const resultDiv = document.getElementById("result");

      async function loadModel() {
        console.log("Model yükleniyor...");
        try {
          encoder = await use.load();
          console.log("Model başarıyla yüklendi.");
          btn.disabled = false;
          btn.innerText = "Analiz Et";
        } catch (error) {
          console.error("Yükleme hatası:", error);
          resultDiv.innerHTML = "<p>Model yüklenirken hata oluştu.</p>";
        }
      }

      async function predict() {
        const text = document.getElementById("inputText").value;
        if (!text.trim()) return;

        btn.disabled = true;
        btn.innerText = "Analiz ediliyor...";

        const embeddings = await encoder.embed([text]);
        const values = await embeddings.data();

        let sum = 0;
        for (let i = 0; i < values.length; i++) {
          sum += values[i];
        }

        let sentiment = sum > 0 ? "Pozitif 😊" : "Negatif 😔";
        resultDiv.innerHTML = "<h4>Sonuç: " + sentiment + "</h4>";

        btn.disabled = false;
        btn.innerText = "Analiz Et";
      }

      btn.addEventListener("click", predict);
      window.onload = loadModel;
    </script>
  </body>
</html>
